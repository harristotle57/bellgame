[project]
name = "bellgame"
version = "0.1.0"
description = "The CHSH game over simulated quantum networks: polarization photons in Fock modes, for students."
readme = "README.md"
requires-python = ">=3.12, <3.15"
dependencies = [
    "sequence>=1.2,<1.3",
    "numpy>=2.0",
    "scipy>=1.14",
    "matplotlib>=3.9",
    "networkx>=3.3",
]

[dependency-groups]
dev = [
    "jupyterlab>=4.2",
    "jupytext>=1.16",
    "ipykernel>=6.29",
    "spyder-kernels==3.0.*",
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bellgame"]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = "--doctest-modules"
filterwarnings = ["ignore::SyntaxWarning"]  # from an escape sequence inside sequence 1.2.0

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = ["B905"]  # zip(strict=...) is noise for teaching code

[tool.ruff.lint.per-file-ignores]
"src/bellgame/__init__.py" = ["F401"]  # names are re-exported as bg.<name>
