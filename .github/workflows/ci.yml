name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg            # draw plots off-screen
      PYTHONWARNINGS: ignore::SyntaxWarning
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install the project
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check src tests labs examples students

      - name: Tests (including docstring examples)
        run: uv run pytest

      - name: Run every lab and example top to bottom
        run: |
          set -e
          for script in labs/*.py examples/*.py students/_template/*.py; do
            echo "::group::$script"
            uv run python "$script"
            echo "::endgroup::"
          done

      - name: Labs open as notebooks
        run: |
          set -e
          mkdir -p /tmp/notebooks
          for lab in labs/*.py; do
            uv run jupytext --to ipynb -o "/tmp/notebooks/$(basename "$lab" .py).ipynb" "$lab"
          done
